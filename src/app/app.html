<div class="animated-title-wrapper">
  <h1 class="animated-title">
    <span *ngFor="let char of animatedTitle; let i = index" [ngClass]="'color' + ((i % 3) + 1)"
      style="margin: 0 0.08em; display: inline-block;">{{ char }}</span>
  </h1>
</div>
<div class="container">
  <mat-tab-group [selectedIndex]="tabIndex" (selectedIndexChange)="onTabChange($event)">
    <mat-tab label="Λοταρία"></mat-tab>
    <mat-tab label="Λίστα Γονεών"></mat-tab>
    <mat-tab label="Λίστα Δώρων"></mat-tab>
  </mat-tab-group>
  <router-outlet></router-outlet>
</div>
